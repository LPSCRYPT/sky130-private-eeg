<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title">
<title id="title">Only the commitment core is proposed as reusable shuttle IP. A separate trusted sampler and signer provide provenance. The laptop verifies the public manifest and zero-knowledge proofs.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#314257"/></marker></defs>
