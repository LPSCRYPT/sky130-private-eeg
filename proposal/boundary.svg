<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 252" role="img" aria-labelledby="title desc">
<title id="title">What the Sky130 core commits</title>
<desc id="desc">A digitizer and timer supply a code and a present flag at each tick. The core packs ten slots at a time and uses one field multiplier for the Poseidon permutation. The only data result is a 32-byte root. Signing and proving are separate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#446369"/></marker></defs>
<rect width="800" height="252" rx="9" fill="#f7faf9"/>
<g font-family="DejaVu Sans,sans-serif" fill="#1f3941">
<text x="20" y="30" font-size="18" font-weight="bold">At the digitizer output</text>
<text x="779" y="30" text-anchor="end" font-size="14">One channel · 250 slots/s</text>
<rect x="178" y="52" width="432" height="138" rx="8" fill="#e6f2ee" stroke="#51827a"/>
<text x="192" y="78" font-weight="bold" font-size="15">eeg_capture · proposed Sky130 block</text>
<g fill="white" stroke="#779891"><rect x="193" y="94" width="167" height="57" rx="4"/><rect x="391" y="94" width="200" height="57" rx="4"/></g>
<g text-anchor="middle" font-size="15"><text x="91" y="112">24-bit ADC code</text><text x="91" y="132">+ present flag</text>
<text x="276" y="118" font-weight="bold">Pack 10 slots</text><text x="276" y="138">250 bits per word</text>
<text x="491" y="118" font-weight="bold">Poseidon permutation</text><text x="491" y="138">One shared multiplier</text>
<text x="705" y="114" font-weight="bold">32-byte root</text><text x="705" y="135">+ valid signal</text></g>
<g fill="none" stroke="#446369" stroke-width="2" marker-end="url(#arrow)"><path d="M154 121h36"/><path d="M361 121h26"/><path d="M593 121h50"/></g>
<text x="194" y="175" font-size="14">Start: challenge, window index and private opening</text>
<path d="M20 204h760" stroke="#b9cdca"/>
<text x="20" y="226" font-weight="bold" font-size="14">Outside the proposed block</text>
<text x="248" y="226" font-size="14">The recorder signs the roots; the prover uses the private samples.</text>
</g></svg>