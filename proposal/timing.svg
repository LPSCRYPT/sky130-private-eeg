<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 211" role="img" aria-labelledby="title desc">
<title id="title">Worst setup slack by cell library at 10 and 12 MHz</title>
<desc id="desc">Circles denote 10 MHz; squares denote 12 MHz. A point left of zero misses setup. Placement estimates, not silicon.</desc>
<rect width="800" height="211" rx="8" fill="#f7faf9"/><g font-family="DejaVu Sans,sans-serif" font-size="15" fill="#223c43">
<text x="14" y="24" font-size="17" font-weight="bold">Worst setup slack (ns)</text>
<circle cx="531" cy="18" r="5" stroke="#00696b" stroke-width="2.5" fill="white"/><text x="544" y="23">10 MHz</text>
<rect x="652" y="13" width="10" height="10" fill="#864923"/><text x="671" y="23">12 MHz</text>
<path d="M210.0 38v135" stroke="#d0dbdb"/><text x="210.0" y="198" text-anchor="middle">-10</text>
<path d="M271.7 38v135" stroke="#52656b"/><text x="271.7" y="198" text-anchor="middle">0</text>
<path d="M395.0 38v135" stroke="#d0dbdb"/><text x="395.0" y="198" text-anchor="middle">20</text>
<path d="M518.3 38v135" stroke="#d0dbdb"/><text x="518.3" y="198" text-anchor="middle">40</text>
<path d="M641.7 38v135" stroke="#d0dbdb"/><text x="641.7" y="198" text-anchor="middle">60</text>
<path d="M765.0 38v135" stroke="#d0dbdb"/><text x="765.0" y="198" text-anchor="middle">80</text>
<text x="14" y="56">Typical · 25 °C · 1.80 V</text>
<path d="M662.2 51H559.5" stroke="#9aaeb0" stroke-width="2"/>
<circle cx="662.2" cy="51" r="5" fill="white" stroke="#00696b" stroke-width="2.5"/>
<rect x="554.5" y="46" width="10" height="10" fill="#864923"/>
<text x="14" y="84">Slow · −40 °C · 1.60 V</text>
<path d="M357.5 79H254.7" stroke="#9aaeb0" stroke-width="2"/>
<circle cx="357.5" cy="79" r="5" fill="white" stroke="#00696b" stroke-width="2.5"/>
<rect x="249.7" y="74" width="10" height="10" fill="#864923"/>
<text x="14" y="112">Slow · 100 °C · 1.60 V</text>
<path d="M421.4 107H318.6" stroke="#9aaeb0" stroke-width="2"/>
<circle cx="421.4" cy="107" r="5" fill="white" stroke="#00696b" stroke-width="2.5"/>
<rect x="313.6" y="102" width="10" height="10" fill="#864923"/>
<text x="14" y="140">Fast · −40 °C · 1.95 V</text>
<path d="M752.0 135H649.2" stroke="#9aaeb0" stroke-width="2"/>
<circle cx="752.0" cy="135" r="5" fill="white" stroke="#00696b" stroke-width="2.5"/>
<rect x="644.2" y="130" width="10" height="10" fill="#864923"/>
<text x="14" y="168">Fast · 100 °C · 1.95 V</text>
<path d="M753.4 163H650.6" stroke="#9aaeb0" stroke-width="2"/>
<circle cx="753.4" cy="163" r="5" fill="white" stroke="#00696b" stroke-width="2.5"/>
<rect x="645.6" y="158" width="10" height="10" fill="#864923"/>
</g></svg>
